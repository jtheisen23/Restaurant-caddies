<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="g" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#1a3a2c"/>
      <stop offset="60%" stop-color="#0b1f17"/>
      <stop offset="100%" stop-color="#06140e"/>
    </radialGradient>
    <radialGradient id="copper" cx="80%" cy="15%" r="35%">
      <stop offset="0%" stop-color="#b8753a" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#b8753a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#g)"/>
  <rect width="1200" height="630" fill="url(#copper)"/>

  <!-- subtle inner border -->
  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="#b8753a" stroke-width="1" opacity="0.22"/>

  <!-- top wordmark, type-only (no icon — defers to the real brand logo on-site) -->
  <text x="80" y="118" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="600" fill="#faf7f2" letter-spacing="0.18em">RESTAURANT CADDIES</text>
  <line x1="80" y1="138" x2="200" y2="138" stroke="#b8753a" stroke-width="2" opacity="0.9"/>

  <!-- main tagline (the big moment) -->
  <text x="80" y="320" font-family="Fraunces, Georgia, serif" font-size="96" font-weight="600" fill="#faf7f2" letter-spacing="-0.02em">Strategy and execution.</text>
  <text x="80" y="424" font-family="Fraunces, Georgia, serif" font-size="96" font-weight="600" fill="#b8753a" font-style="italic" letter-spacing="-0.02em">No mulligans.</text>

  <!-- supporting line -->
  <text x="80" y="510" font-family="Inter, system-ui, sans-serif" font-size="24" fill="#c8c2b3" letter-spacing="0.005em">Independent advisory for restaurant brands —</text>
  <text x="80" y="544" font-family="Inter, system-ui, sans-serif" font-size="24" fill="#c8c2b3" letter-spacing="0.005em">technology, operations, and franchise development.</text>
</svg>
